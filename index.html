<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamStore Premium</title>
    
    <!-- 1. Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 2. React y ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- 3. Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#050508] text-white font-sans overflow-x-hidden selection:bg-purple-500/30">
    
    <div id="root"></div>

    <script type="text/babel">
        class ErrorBoundary extends React.Component {
            constructor(props) { super(props); this.state = { hasError: false, error: null }; }
            static getDerivedStateFromError(error) { return { hasError: true, error }; }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="min-h-screen bg-black text-white flex flex-col items-center justify-center p-10 text-center">
                            <div className="w-16 h-16 bg-red-500/20 rounded-full flex items-center justify-center mb-6 border border-red-500">
                                <span className="text-red-500 text-3xl font-black">!</span>
                            </div>
                            <h1 className="text-red-500 text-3xl font-bold mb-4">Algo impidió cargar la tienda</h1>
                            <pre className="bg-gray-900 p-6 rounded-xl text-red-400 w-full max-w-2xl overflow-auto text-left text-sm border border-white/10 shadow-2xl">
                                {this.state.error && this.state.error.toString()}
                            </pre>
                            <button onClick={() => window.location.reload()} className="mt-8 bg-white/10 hover:bg-white/20 px-6 py-3 rounded-full transition-all">Recargar Página</button>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        const { useState, useEffect } = React;
        
        const ICONS = {
            Tv: '<rect x="2" y="7" width="20" height="15" rx="2" ry="2"/><polyline points="17 2 12 7 7 2"/>',
            Monitor: '<rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/>',
            Play: '<polygon points="5 3 19 12 5 21 5 3"/>',
            Sparkles: '<path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>',
            Music: '<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',
            ShieldCheck: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 12 11 14 15 10"/>',
            Shield: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',
            Globe: '<circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>',
            Zap: '<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>',
            Smartphone: '<rect x="5" y="2" width="14" height="20" rx="2" ry="2"/><line x1="12" y1="18" x2="12.01" y2="18"/>',
            MessageCircle: '<path d="m3 21 1.9-5.7a8.5 8.5 0 1 1 3.8 3.8z"/>',
            Star: '<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>',
            ChevronRight: '<polyline points="9 18 15 12 9 6"/>',
            ChevronLeft: '<polyline points="15 18 9 12 15 6"/>',
            Menu: '<line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/>',
            X: '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
            CheckCircle2: '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>',
            ShoppingCart: '<circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>',
            Plus: '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
            Minus: '<line x1="5" y1="12" x2="19" y2="12"/>',
            Trash2: '<polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/>',
            Settings: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>',
            PlusCircle: '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/>',
            Edit3: '<path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>',
            Lock: '<rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
            Image: '<rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/>',
            RefreshCw: '<polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>',
            CloudUpload: '<path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M12 12v9"/><path d="m16 16-4-4-4 4"/>'
        };

        const SvgIcon = ({ name, className = "w-6 h-6", ...props }) => {
            const path = ICONS[name] || ICONS['Tv']; 
            return (
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} dangerouslySetInnerHTML={{__html: path}} {...props} />
            );
        };

        const IconWhatsApp = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                <path d="M13.601 2.326A7.854 7.854 0 0 0 7.994 0C3.627 0 .068 3.558.064 7.926c0 1.399.366 2.76 1.057 3.965L0 16l4.204-1.102a7.933 7.933 0 0 0 3.79.965h.004c4.368 0 7.926-3.558 7.93-7.93A7.898 7.898 0 0 0 13.6 2.326zM7.994 14.521a6.573 6.573 0 0 1-3.356-.92l-.24-.144-2.494.654.666-2.433-.156-.251a6.56 6.56 0 0 1-1.007-3.505c0-3.626 2.957-6.584 6.591-6.584a6.56 6.56 0 0 1 4.66 1.931 6.557 6.557 0 0 1 1.928 4.66c-.004 3.639-2.961 6.592-6.592 6.592zm3.615-4.934c-.197-.099-1.17-.578-1.353-.646-.182-.065-.315-.099-.445.099-.133.197-.513.646-.627.775-.114.133-.232.148-.43.05-.197-.1-.836-.308-1.592-.985-.59-.525-.985-1.175-1.103-1.372-.114-.198-.011-.304.088-.403.087-.088.197-.232.296-.346.1-.114.133-.198.198-.33.065-.134.034-.248-.015-.347-.05-.099-.445-1.076-.612-1.47-.16-.389-.323-.335-.445-.34-.114-.007-.247-.007-.38-.007a.729.729 0 0 0-.529.247c-.182.198-.691.677-.691 1.654 0 .977.71 1.916.81 2.049.098.133 1.394 2.132 3.383 2.992.47.205.84.326 1.129.418.475.152.904.129 1.246.08.38-.058 1.171-.48 1.338-.943.164-.464.164-.86.114-.943-.049-.084-.182-.133-.38-.232z"/>
            </svg>
        );

        const IconCart = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
            </svg>
        );

        const WHATSAPP_NUMBER = "51999999999";
        const API_URL = "https://script.google.com/macros/s/AKfycbxTO7BwElRHrIs3TqUJ5shqTe049-bJ1s2EGEa4N69eJYhBiNR9kcRy_O-mSgSaf3E/exec";

        const HERO_SLIDES = [
          { id: 1, video: "https://i.imgur.com/8NoEwnp.mp4" },
          { id: 2, video: "https://media.w3.org/2010/05/sintel/trailer.mp4" }
        ];

        const CATEGORIES = ["Todos", "Streaming", "Licencias", "IA", "Otros", "Zona Gammer"];

        function App() {
          const [products, setProducts] = useState([]);
          const [isLoading, setIsLoading] = useState(true);
          const [isSaving, setIsSaving] = useState(false);
          const [dbStatus, setDbStatus] = useState('connecting');

          const [activeCategory, setActiveCategory] = useState("Todos");
          const [currentSlide, setCurrentSlide] = useState(0);
          
          const [cart, setCart] = useState([]);
          const [isCartOpen, setIsCartOpen] = useState(false);
          
          const [selectedProduct, setSelectedProduct] = useState(null);

          const [isAdminView, setIsAdminView] = useState(false);
          const [showPasswordModal, setShowPasswordModal] = useState(false);
          const [passwordInput, setPasswordInput] = useState("");
          
          const [isEditing, setIsEditing] = useState(false);
          const [editingId, setEditingId] = useState(null);
          const [newProduct, setNewProduct] = useState({
            name: "", price: "", category: "Streaming", type: "", desc: "", iconName: "Tv", color: "from-blue-500 to-blue-800", label: "", image: "", puntos: 0
          });

          const safeProducts = Array.isArray(products) ? products : [];

          useEffect(() => {
            const fetchFromSheets = async () => {
              try {
                setDbStatus('connecting');
                const response = await fetch(API_URL);
                const result = await response.json();
                
                if (result && result.status === "success" && Array.isArray(result.data)) {
                  setProducts(result.data);
                  setDbStatus('connected');
                } else {
                  setProducts([]); 
                  setDbStatus('error');
                }
              } catch (error) {
                console.error("Error cargando de Sheets:", error);
                setProducts([]);
                setDbStatus('error');
              } finally {
                setIsLoading(false);
              }
            };
            fetchFromSheets();
          }, []);

          const syncToSheets = async (updatedProductsArray) => {
            setIsSaving(true);
            setDbStatus('connecting');
            try {
              await fetch(API_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: "sync", products: updatedProductsArray })
              });
              setDbStatus('connected'); 
            } catch (error) {
              console.error("Error guardando en Sheets:", error);
              setDbStatus('error');
            } finally {
              setIsSaving(false);
            }
          };

          useEffect(() => {
            const timer = setInterval(() => setCurrentSlide((prev) => (prev === HERO_SLIDES.length - 1 ? 0 : prev + 1)), 25000);
            return () => clearInterval(timer);
          }, []);

          const sortedProducts = [...safeProducts].sort((a, b) => {
            const puntosA = parseInt(a.puntos) || 0;
            const puntosB = parseInt(b.puntos) || 0;
            return puntosB - puntosA; 
          });

          const filteredProducts = activeCategory === "Todos" 
            ? sortedProducts 
            : sortedProducts.filter(p => p.category === activeCategory);

          const addToCart = (product) => {
            setCart(prev => {
              const existing = prev.find(item => item.product.id === product.id);
              if (existing) return prev.map(item => item.product.id === product.id ? { ...item, quantity: item.quantity + 1 } : item);
              return [...prev, { product, quantity: 1 }];
            });
          };

          const updateQuantity = (productId, delta) => setCart(prev => prev.map(item => {
            if (item.product.id === productId) {
              const newQuantity = item.quantity + delta;
              return newQuantity > 0 ? { ...item, quantity: newQuantity } : item;
            }
            return item;
          }).filter(item => item.quantity > 0));

          const removeFromCart = (productId) => setCart(prev => prev.filter(item => item.product.id !== productId));
          const getCartTotal = () => cart.reduce((total, item) => total + ((parseFloat(item.product.price) || 0) * item.quantity), 0);
          const getCartCount = () => cart.reduce((count, item) => count + item.quantity, 0);

          const handleWhatsAppCheckout = () => {
            if (cart.length === 0) return;
            let message = "Hola, quiero realizar el siguiente pedido:\n\n";
            cart.forEach(item => { message += `• ${item.quantity}x ${item.product.name} (${item.product.type}) - S/${(parseFloat(item.product.price) || 0) * item.quantity}\n`; });
            message += `\n*Total a pagar: S/${getCartTotal()}*`;
            window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`, '_blank');
          };

          const handleDirectWhatsAppBuy = (product) => {
            let message = `Hola, quiero comprar directamente este producto:\n\n`;
            message += `• ${product.name} (${product.type}) - S/${product.price}\n\n`;
            message += `¿Cuáles son los medios de pago?`;
            window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`, '_blank');
          };

          const handleAdminLogin = (e) => {
            e.preventDefault();
            if (passwordInput === "123456") {
              setIsAdminView(true);
              setShowPasswordModal(false);
              setPasswordInput("");
            } else {
              alert("Contraseña incorrecta");
            }
          };

          const handleSaveProduct = (e) => {
            e.preventDefault();
            let updatedProducts = [];
            
            if (isEditing) {
              updatedProducts = safeProducts.map(p => p.id === editingId ? {
                ...p, name: newProduct.name, price: parseFloat(newProduct.price), category: newProduct.category, type: newProduct.type,
                desc: newProduct.desc, iconName: newProduct.iconName, color: newProduct.color, label: newProduct.label, image: newProduct.image, puntos: parseInt(newProduct.puntos) || 0
              } : p);
              setIsEditing(false);
              setEditingId(null);
            } else {
              const newId = safeProducts.length > 0 ? Math.max(...safeProducts.map(p => parseInt(p.id) || 0)) + 1 : 1;
              const productToAdd = {
                id: newId, name: newProduct.name, price: parseFloat(newProduct.price), category: newProduct.category, type: newProduct.type,
                desc: newProduct.desc, iconName: newProduct.iconName, color: newProduct.color, label: newProduct.label, image: newProduct.image, puntos: parseInt(newProduct.puntos) || 0
              };
              updatedProducts = [productToAdd, ...safeProducts];
            }
            
            setProducts(updatedProducts);
            syncToSheets(updatedProducts);
            setNewProduct({ name: "", price: "", category: "Streaming", type: "", desc: "", iconName: "Tv", color: "from-blue-500 to-blue-800", label: "", image: "", puntos: 0 });
          };

          const handleEditClick = (product) => {
            setIsEditing(true);
            setEditingId(product.id);
            setNewProduct({
              name: product.name || "", price: product.price || "", category: product.category || "Streaming", type: product.type || "", desc: product.desc || "", iconName: product.iconName || "Tv", color: product.color || "from-blue-500 to-blue-800", label: product.label || "", image: product.image || "", puntos: product.puntos || 0
            });
            window.scrollTo({ top: 0, behavior: 'smooth' });
          };

          const handleCancelEdit = () => {
            setIsEditing(false);
            setEditingId(null);
            setNewProduct({ name: "", price: "", category: "Streaming", type: "", desc: "", iconName: "Tv", color: "from-blue-500 to-blue-800", label: "", image: "", puntos: 0 });
          };

          const handleDeleteProduct = (id) => {
            if (window.confirm("¿Estás seguro de eliminar este producto?")) {
              const updatedProducts = safeProducts.filter(p => p.id !== id);
              setProducts(updatedProducts);
              removeFromCart(id);
              syncToSheets(updatedProducts);
            }
          };

          const scrollToCatalog = () => {
            document.getElementById("catalogo-premium")?.scrollIntoView({ behavior: 'smooth' });
          };

          return (
            <div className="min-h-screen relative overflow-x-hidden bg-transparent">
              
              {/* --- 🌌 FONDO DE AURORAS BOREALES Y MATRIX 🌌 --- */}
              <div className="fixed inset-0 z-[-10] pointer-events-none overflow-hidden bg-[#050508]">
                  {/* Cuadrícula Matrix en movimiento (Más sutil) */}
                  <div className="absolute inset-[-50px] bg-grid opacity-100"></div>

                  {/* Auroras Boreales (Luces de fondo lentas y profundas) */}
                  <div className="aurora-1 absolute top-[-10%] left-[-10%] w-[60%] h-[60%] bg-gradient-to-br from-purple-900/40 to-transparent blur-[100px] rounded-full mix-blend-screen"></div>
                  <div className="aurora-2 absolute bottom-[-10%] right-[-10%] w-[60%] h-[60%] bg-gradient-to-tl from-blue-900/40 to-transparent blur-[100px] rounded-full mix-blend-screen"></div>
                  <div className="aurora-3 absolute top-[30%] left-[30%] w-[40%] h-[40%] bg-gradient-to-tr from-fuchsia-900/30 to-transparent blur-[100px] rounded-full mix-blend-screen"></div>
                  
                  {/* --- NUEVO: RAYOS NEÓN ALEATORIOS --- */}
                  <div className="neon-beam neon-beam-h beam-1"></div>
                  <div className="neon-beam neon-beam-h beam-2"></div>
                  <div className="neon-beam neon-beam-v beam-3"></div>
                  <div className="neon-beam neon-beam-v beam-4"></div>
                  <div className="neon-beam neon-beam-h beam-5"></div>
                  <div className="neon-beam neon-beam-h beam-6"></div>
              </div>

              {/* LOGO SUPERIOR ABSOLUTO (Sobre el video, no se queda fijo al bajar) */}
              <header className="absolute top-0 w-full z-50 pt-8 pb-4 pointer-events-none">
                <div className="container mx-auto px-6 flex justify-center">
                    <img 
                        src="https://i.imgur.com/0illok2.png" 
                        alt="StreamStore Premium" 
                        className="h-20 sm:h-24 md:h-32 lg:h-40 object-contain drop-shadow-[0_0_20px_rgba(168,85,247,0.5)] pointer-events-auto cursor-pointer transition-transform hover:scale-105" 
                        onClick={() => {setActiveCategory("Todos"); window.scrollTo({top:0, behavior:'smooth'})}} 
                    />
                </div>
              </header>

              {isAdminView ? (
                <main className="pt-40 pb-20 container mx-auto px-6 lg:px-12 relative z-10 min-h-screen">
                  
                  {/* CABECERA ADMIN */}
                  <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-10 border-b border-white/10 pb-6">
                    <div>
                        <h2 className="text-3xl md:text-4xl font-black flex items-center gap-3"><SvgIcon name="Settings" className="w-8 h-8 text-purple-500" />Panel de Administración</h2>
                        <p className="text-gray-400 mt-1">Agrega, edita y organiza tu catálogo. Los cambios se guardan automáticamente en tu Google Sheets.</p>
                    </div>
                    <div className="flex items-center gap-4">
                        {isSaving && <span className="text-xs text-green-400 flex items-center gap-1 animate-pulse"><SvgIcon name="CloudUpload" className="w-4 h-4"/> Sincronizando...</span>}
                        <button onClick={() => setIsAdminView(false)} className="bg-white/10 hover:bg-white/20 border border-white/10 px-6 py-3 rounded-xl text-sm font-bold transition-all text-white flex items-center gap-2 shadow-lg">Volver a la Tienda</button>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                    <div className="bg-[#12141c] border border-white/10 rounded-3xl p-6 lg:col-span-1 h-fit shadow-2xl relative overflow-hidden">
                      {isEditing && <div className="absolute top-0 left-0 w-full h-1 bg-blue-500"></div>}
                      <h3 className="text-xl font-bold mb-6 flex items-center gap-2">
                        {isEditing ? <SvgIcon name="Edit3" className="w-5 h-5 text-blue-500" /> : <SvgIcon name="PlusCircle" className="w-5 h-5 text-green-500" />}
                        {isEditing ? "Editar Producto" : "Añadir Nuevo Producto"}
                      </h3>
                      
                      <form onSubmit={handleSaveProduct} className="flex flex-col gap-4 text-sm">
                        <div><label className="block text-gray-400 mb-1">Nombre del Servicio</label><input required type="text" value={newProduct.name} onChange={e => setNewProduct({...newProduct, name: e.target.value})} className="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-purple-500" placeholder="Ej. Crunchyroll Premium" /></div>
                        
                        <div className="grid grid-cols-2 gap-4">
                          <div><label className="block text-gray-400 mb-1">Precio (S/)</label><input required type="number" min="0" step="0.1" value={newProduct.price} onChange={e => setNewProduct({...newProduct, price: e.target.value})} className="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-purple-500" placeholder="15.00" /></div>
                          <div><label className="block text-gray-400 mb-1">Posición / Puntos</label><input type="number" value={newProduct.puntos} onChange={e => setNewProduct({...newProduct, puntos: e.target.value})} className="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-yellow-500" placeholder="Ej. 100" /></div>
                        </div>

                                        {cart.find(item => item.product.id === selectedProduct.id) ? (
                                            <div className="flex-1 flex items-center justify-between bg-white/10 rounded-xl px-4 py-3 sm:py-4 border border-white/10">
                                                <button onClick={() => updateQuantity(selectedProduct.id, -1)} className="p-2 hover:text-purple-400 transition-colors"><SvgIcon name="Minus" className="w-5 h-5" /></button>
                                                <span className="font-bold text-lg w-8 text-center">{cart.find(item => item.product.id === selectedProduct.id).quantity}</span>
                                                <button onClick={() => updateQuantity(selectedProduct.id, 1)} className="p-2 hover:text-purple-400 transition-colors"><SvgIcon name="Plus" className="w-5 h-5" /></button>
                                            </div>
                                        ) : (
                                            <button onClick={() => addToCart(selectedProduct)} className="flex-1 bg-white/5 hover:bg-purple-600 border border-white/10 hover:border-purple-500 text-white py-3 sm:py-4 rounded-xl flex items-center justify-center gap-2 font-bold text-sm sm:text-base transition-all hover:scale-[1.02]">
                                                <IconCart /> Agregar al Carrito
                                            </button>
                                        )}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                  )}
                </>
              )}

              {showPasswordModal && (
                <div className="fixed inset-0 z-[70] flex items-center justify-center bg-black/80 backdrop-blur-sm px-4">
                  <div className="bg-[#12141c] border border-white/10 rounded-3xl p-8 max-w-sm w-full shadow-2xl relative">
                    <button onClick={() => setShowPasswordModal(false)} className="absolute top-4 right-4 text-gray-400 hover:text-white"><SvgIcon name="X" className="w-5 h-5" /></button>
                    <div className="flex justify-center mb-6"><div className="p-4 bg-purple-500/20 rounded-full"><SvgIcon name="Lock" className="w-8 h-8 text-purple-500" /></div></div>
                    <h3 className="text-xl font-bold text-center mb-2">Acceso Restringido</h3>
                    <form onSubmit={handleAdminLogin}>
                      <input type="password" value={passwordInput} onChange={(e) => setPasswordInput(e.target.value)} placeholder="Contraseña" required className="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white text-center tracking-widest focus:outline-none focus:border-purple-500 mb-4" />
                      <button type="submit" className="w-full bg-purple-600 hover:bg-purple-500 text-white font-bold py-3 rounded-xl transition-all">Desbloquear</button>
                    </form>
                  </div>
                </div>
              )}

              <style>{`
                .hide-scrollbar::-webkit-scrollbar { display: none; } 
                .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; } 
                @keyframes slideIn { from { transform: translateY(20px); opacity: 0;} to { transform: translateY(0); opacity: 1;} }
                
                /* --- ANIMACIONES DEL FONDO NEÓN AURORAS + MATRIX --- */
                .bg-grid {
                    background-size: 50px 50px;
                    background-image: linear-gradient(to right, rgba(168, 85, 247, 0.25) 1px, transparent 1px),
                                      linear-gradient(to bottom, rgba(168, 85, 247, 0.25) 1px, transparent 1px);
                    mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 5%, rgba(0,0,0,0) 90%);
                    -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 5%, rgba(0,0,0,0) 90%);
                    animation: moveGrid 3s linear infinite;
                }
                
                @keyframes moveGrid {
                    0% { transform: translateY(0); }
                    100% { transform: translateY(50px); }
                }

                /* Auroras Boreales: Formas ovaladas y fluidas que se estiran y rotan */
                @keyframes aurora-wave-1 {
                    0% { transform: rotate(0deg) scaleX(1) translateY(0); opacity: 0.5; }
                    50% { transform: rotate(5deg) scaleX(1.2) translateY(5vh); opacity: 0.8; }
                    100% { transform: rotate(0deg) scaleX(1) translateY(0); opacity: 0.5; }
                }
                @keyframes aurora-wave-2 {
                    0% { transform: rotate(0deg) scaleY(1) translateX(0); opacity: 0.6; }
                    50% { transform: rotate(-5deg) scaleY(1.3) translateX(-5vw); opacity: 0.9; }
                    100% { transform: rotate(0deg) scaleY(1) translateX(0); opacity: 0.6; }
                }
                @keyframes aurora-wave-3 {
                    0% { transform: rotate(2deg) scale(1) translateY(0); }
                    50% { transform: rotate(-2deg) scale(1.1) translateY(-5vh); opacity: 0.7;}
                    100% { transform: rotate(2deg) scale(1) translateY(0); }
                }

                .aurora-1 { animation: aurora-wave-1 15s infinite ease-in-out; }
                .aurora-2 { animation: aurora-wave-2 20s infinite ease-in-out; }
                .aurora-3 { animation: aurora-wave-3 18s infinite ease-in-out alternate; }
                
                /* --- RAYOS NEÓN ALEATORIOS --- */
                .neon-beam {
                    position: absolute;
                    border-radius: 50%;
                    opacity: 0;
                    pointer-events: none;
                }
                .neon-beam-h {
                    width: 40vw;
                    height: 2px;
                    background: linear-gradient(90deg, transparent, rgba(168, 85, 247, 0.8), rgba(59, 130, 246, 0.8), transparent);
                    box-shadow: 0 0 15px 2px rgba(168, 85, 247, 0.4);
                }
                .neon-beam-v {
                    width: 2px;
                    height: 40vh;
                    background: linear-gradient(180deg, transparent, rgba(168, 85, 247, 0.8), rgba(59, 130, 246, 0.8), transparent);
                    box-shadow: 0 0 15px 2px rgba(59, 130, 246, 0.4);
                }

                /* Configuraciones aleatorias de los rayos */
                .beam-1 { top: 15%; left: -50vw; animation: shoot-right 7s linear infinite; animation-delay: 1s; }
                .beam-2 { bottom: 25%; right: -50vw; animation: shoot-left 11s linear infinite; animation-delay: 3s; }
                .beam-3 { left: 15%; top: -50vh; animation: shoot-down 9s linear infinite; animation-delay: 5s; }
                .beam-4 { right: 20%; bottom: -50vh; animation: shoot-up 13s linear infinite; animation-delay: 2s; }
                .beam-5 { top: 40%; left: -50vw; transform: rotate(25deg); animation: shoot-right 10s linear infinite; animation-delay: 7s; }
                .beam-6 { top: 10%; right: -50vw; transform: rotate(-35deg); animation: shoot-left 15s linear infinite; animation-delay: 0s; }

                @keyframes shoot-right {
                    0% { left: -50vw; opacity: 0; }
                    10% { opacity: 1; }
                    90% { opacity: 1; }
                    100% { left: 120vw; opacity: 0; }
                }
                @keyframes shoot-left {
                    0% { right: -50vw; opacity: 0; }
                    10% { opacity: 1; }
                    90% { opacity: 1; }
                    100% { right: 120vw; opacity: 0; }
                }
                @keyframes shoot-down {
                    0% { top: -50vh; opacity: 0; }
                    10% { opacity: 1; }
                    90% { opacity: 1; }
                    100% { top: 120vh; opacity: 0; }
                }
                @keyframes shoot-up {
                    0% { bottom: -50vh; opacity: 0; }
                    10% { opacity: 1; }
                    90% { opacity: 1; }
                    100% { bottom: 120vh; opacity: 0; }
                }
              `}</style>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>
</body>
</html>
